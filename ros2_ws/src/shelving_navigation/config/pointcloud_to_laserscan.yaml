pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true
    # Keep the PointCloud2 frame. The Ridgeback standalone publishes the
    # matching base_link -> LiDAR TF using the sensor's real frame_id.
    target_frame: ""
    transform_tolerance: 0.05

    # Select a horizontal obstacle band around the LiDAR frame.
    min_height: -0.10
    max_height: 0.50

    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00872665
    scan_time: 0.10

    # /scan is used by AMCL, the global costmap, and collision monitoring.
    # 1.05 m removes the observed Ridgeback/Franka self-return.
    range_min: 1.05
    range_max: 30.0
    use_inf: true
    inf_epsilon: 1.0
