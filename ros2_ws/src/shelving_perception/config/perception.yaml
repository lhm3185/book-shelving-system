vision_manager:
  ros__parameters:
    use_sim_time: true

    # Isaac Sim 카메라 입력
    rgb_topic: /rgb
    depth_topic: /depth
    camera_info_topic: /camera_info
    camera_frame: wrist_camera_optical_frame
    target_frame: arm_base_link

    depth_registered: true
    depth_scale: 0.0
    sync_slop: 0.1

    # Manipulation이 요청하는 perception action
    grasp_action: /detect_grasp_point
    slot_action: /detect_target_slot
    action_timeout_s: 15.0

    # 검출 결과 확인용 영상
    debug_image_topic: /perception/debug_image

    # ROI 안에서 우선 적용하는 고신뢰도 기준
    confidence_threshold: 0.75
    # 고신뢰도 후보가 없을 때 접근 가능한 ROI 내부에서만 적용하는 보조 기준
    fallback_confidence_threshold: 0.20
    publish_best_only: true

    # 현재 트레이는 서로 다른 규격의 책 5권을 사용한다.
    # 0은 perception이 치수를 확정하지 않는다는 뜻이며, manipulation이
    # 선택된 트레이 슬롯의 실제 교정값으로 채운다.
    default_book_thickness: 0.0
    default_book_height: 0.0
    default_book_width: 0.0

    # 트레이 영역: arm_base_link 기준 3차원 ROI
    book_roi_enabled: true
    book_roi_min: [-0.48, -0.12, 0.12]
    book_roi_max: [-0.21, 0.10, 0.32]

    # 책 방향 보정
    gripper_roll: 0.0
    gripper_pitch: 0.0
    gripper_yaw_offset: 0.0

    # 책장 검출 설정
    shelf_confidence_threshold: 0.50
    # 책 ROI 좌표 기준
    slot_position_frame: arm_base_link

    # Depth 기반 연속 빈 영역 판정
    target_sample_radius_px: 5
    target_side_offset_px: 25
    target_min_depth_difference: 0.05

    # Manipulation에 반환할 삽입 설정
    insertion_depth: 0.30
    slot_center_inset: 0.024
    pre_insert_offset: 0.05
