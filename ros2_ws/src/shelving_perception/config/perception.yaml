vision_manager:
  ros__parameters:
    use_sim_time: true
    rgb_topic: /rgb
    depth_topic: /depth
    camera_info_topic: /camera_info
    trigger_topic: /perception/detect_request
    perception_action: /detect_target_slot
    # 통합 실행에서는 manipulation_node가 이 액션을 소유하며 두 층 팔 스캔을 조율합니다.
    enable_action_server: false
    wait_for_trigger: true
    camera_frame: sim_camera
    target_frame: arm_base_link
    depth_registered: true
    depth_scale: 0.0
    sync_slop: 0.1
    book_topic: /perception/books
    book_pose_topic: /perception/book_pose
    debug_image_topic: /perception/debug_image
    depth_debug_image_topic: /perception/depth_debug_image
    depth_debug_max_m: 3.0
    # Depth로 계산한 빈 책장 단의 3D 점을 발행할 토픽입니다.
    empty_slot_topic: /perception/empty_shelf_position
    # 책장 전체 segmentation에 사용하는 YOLO weight 경로입니다.
    # 책장 검출을 인정할 최소 confidence입니다.
    shelf_confidence_threshold: 0.50
    # 자동으로 찾은 빈 공간 중심(C)과 좌/우(L/R) Depth 샘플 설정입니다.
    target_sample_radius_px: 5
    target_side_offset_px: 25
    target_min_depth_difference: 0.05
    gripper_roll: 0.0
    gripper_pitch: 0.0
    gripper_yaw_offset: 0.0
    insertion_depth: 0.30
    # 책장 전면 → 삽입 완료 후 책등 위치의 실측 여유(m).
    slot_center_inset: 0.024
    pre_insert_offset: 0.05
    # Shelf targeting is disabled for the book-only validation stage.
    # target_topic: /perception/empty_shelf_position
    # target_slot_topic: /perception/target_slot
    # scan_radius: 0.15
    # scan_pixel_u: -1
    # scan_pixel_v: -1
    # slot_width: 0.3
    # slot_height: 0.3
    # pre_insert_offset: 0.05
    # target_confidence: 1.0
    confidence_threshold: 0.75
    # 트레이 ROI(팔 기준 3D 상자). 이 레벨은 반납기 트레이(yaw 0)가 카트(yaw 90)에 실려 **책이 팔 +Y 방향으로**
    # 늘어선다 — 기본 상자(x 방향으로 길쭉)는 가운데 3권만 덮었다 (2026-09-23 스냅샷). y 를 -0.20~0.30 으로 눕힌다.
    book_roi_min: [-0.69, -0.20, 0.00]
    book_roi_max: [-0.26, 0.30, 0.32]
