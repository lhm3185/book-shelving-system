vision_manager:
  ros__parameters:
    use_sim_time: true
    rgb_topic: /rgb
    depth_topic: /depth
    camera_info_topic: /camera_info
    trigger_topic: /perception/detect_request
    perception_action: /detect_target_slot
    wait_for_trigger: true
    camera_frame: RSD455
    target_frame: base_link
    depth_registered: true
    depth_scale: 0.0
    sync_slop: 0.5
    book_pose_topic: /perception/book_pose
    debug_image_topic: /perception/debug_image
    show_debug_window: false
    # Depth로 계산한 빈 책장 단의 3D 점을 발행할 토픽입니다.
    empty_slot_topic: /perception/empty_shelf_position
    # 책장 전체 segmentation에 사용하는 YOLO weight 경로입니다.
    shelf_model_path: /home/rokey/livrary_datas/260918_train/best.pt
    # 책장 검출을 인정할 최소 confidence입니다.
    shelf_confidence_threshold: 0.50
    # 책장을 위에서부터 나눌 단 개수입니다.
    shelf_row_count: 5
    # 책 표면과 빈 공간의 깊이 차이 기준(m)입니다.
    shelf_depth_margin: 0.05
    # 삽입 후보 좌표가 정의된 기준 frame입니다.
    slot_position_frame: base_link
    # 검증된 4개 삽입 후보의 x,y,z 좌표를 평탄화해 기록합니다.
    slot_positions: [-0.3497, 0.5495, 0.3399, -0.4297, 0.5495, 0.3399, -0.5097, 0.5495, 0.3399, -0.2697, 0.5495, 0.3399]
    # 후보 중심 주변에서 깊이를 읽을 픽셀 반경입니다.
    slot_sample_radius_px: 10
    # 예상 삽입점보다 먼 값이 빈 칸으로 판정되는 거리(m)입니다.
    slot_empty_depth_margin: 0.04
    # 예상 삽입점보다 가까운 값이 점유로 판정되는 거리(m)입니다.
    slot_occupied_depth_margin: 0.03
    # 샘플 중 먼 깊이값이 차지해야 하는 최소 비율입니다.
    slot_min_far_ratio: 0.50
    # 샘플 중 가까운 물체 깊이가 허용되는 최대 비율입니다.
    slot_max_near_ratio: 0.25
    gripper_roll: 0.0
    gripper_pitch: 0.0
    gripper_yaw_offset: 0.0
    insertion_depth: 0.25
    pre_insert_offset: 0.05
