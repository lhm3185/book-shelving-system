# manipulation_node 파라미터. 실행: ros2 run shelving_manipulation manipulation_node --ros-args --params-file <이 파일>
manipulation_node:
  ros__parameters:
    action_name: /place_book

    grasp_action: /detect_grasp_point
    slot_action: /detect_target_slot

    navigation_action: /navigate_to_target
    navigation_server_timeout_s: 10.0
    navigation_result_timeout_s: 120.0

    global_frame: map
    robot_base_frame: base_link
    arm_base_frame: arm_base_link

    alignment_target_x: -0.35
    # 실제 목표 y 약 0.675 m. navigation_node position_tolerance 0.05 m를
    # 포함하여 명령 목표를 0.625 m로 둔다.
    alignment_target_y: 0.625

    perception_server_timeout_s: 10.0
    perception_result_timeout_s: 20.0
    # 차체 정렬 직후의 오래된 RGB/Depth/TF 프레임을 검출에 쓰지 않는다.
    post_alignment_settle_s: 1.0

    scan_dwell_s: 1.2
    scan_timeout_s: 180.0

    slot_x_snap_to_gap: true
    slot_x_snap_max_m: 0.12

    status_topic: /robot/status

    # 실제 Isaac 작업 실행기와 JSON 명령·상태를 교환한다.
    executor: sim
    sim_command_topic: /manipulation/sim/command
    sim_state_topic: /manipulation/sim/state

    book_profiles_file: ""      # 비우면 패키지 config/book_profiles.yaml
    book_profile: default

    # 시간 (s)
    heartbeat_timeout_s: 10.0   # 시뮬 상태가 이만큼 끊기면 M404 (한 번도 안 오면 M411). Isaac 경로 계획 중 수 초 멈춘다
    goal_timeout_s: 300.0       # 팔 스윕·인식·배치를 포함한 작업 전체 제한
    cancel_timeout_s: 30.0      # 취소 후 안전 정지 보고를 기다리는 시간
    status_rate_hz: 2.0
    feedback_rate_hz: 10.0

    # 목표 검사 (grasp_planner.DEFAULT_LIMITS 와 같은 이름)
    frame_id: arm_base_link
    finger_thickness: 0.0264
    side_clearance: 0.005
    height_clearance: 0.02
    grip_clearance: 0.005
    insertion_yaw: 1.5707963    # 1차 서가 삽입 방향 arm_base_link +Y
    yaw_tolerance: 0.10
    tilt_tolerance: 0.10
    default_insertion_speed: 0.02
    max_insertion_speed: 0.05
    min_confidence: 0.0         # 1차 고정 칸. 비전 연결 시 올린다
    max_target_age_s: 0.0       # 0 = 검사 안 함 (Isaac sim time 정합 후 켠다)
    require_slot_dimensions: false
    max_book_dimension: 0.5
    # AMR 횡이동 후 선택한 빈칸은 arm 기준 x=-0.35 부근으로 들어온다.
    # y 상한 0.85는 현재 shelf_01의 실제 삽입 깊이를 포함한다.
    # z 범위는 하단 목표 약 0.34 m와 상단 목표 약 0.885 m를 모두 허용한다.
    place_region_min: [-0.56, 0.45, 0.25]
    place_region_max: [-0.22, 0.85, 0.95]
