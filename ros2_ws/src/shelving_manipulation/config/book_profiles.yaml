# 로봇팔이 쓰는 책 치수와 1차 트레이 칸 좌표.
# 좌표 계약: arm_base_link, REP-103, m, **AABB 중심** (에셋 원점 아님)
#
# 값 출처: Isaac Sim 5.1.0, 레벨 ing_library_env_v3 + tray_v1, 2026-09-17
#          (~/arm/isaac/multi_book.py --plan-only 의 FRAME 출력. panda_link0 = arm_base_link, 회전 없음)

profiles:
  default:
    # **2026-09-24 실측으로 갱신.** 앞 값은 v3 레벨(2026-09-17)의 것이고 그 뒤로 책
    # 에셋과 스케일이 바뀌었는데 이 파일이 안 따라갔다. 그 탓에 410 높이 검사가
    # 관측(0.2076)과 기대(0.1932)를 14.4 mm 로 갈라 놓고 막았다.
    #   출처: plan_inputs 의 dims (집는 책 cover58), 네 판 일치
    #   앞 값: thickness 0.0353 · height 0.2374 · width 0.1631
    thickness: 0.0352   # 책등 폭
    height: 0.2265      # 책등 길이 (세웠을 때 높이)
    # 책등 → 앞마구리 (서가에서의 깊이). **AABB 가 아니라 `dims` 값이다** —
    # 트레이 책은 조금씩 기울어 있어 AABB(153~154 mm)가 실제보다 크다.
    width: 0.1517
    mass: 0.5           # kg (Isaac 책 질량)

tray:
  frame_id: arm_base_link
  # 트레이에 책등이 위로 선 책의 AABB 중심. 칸 간격 0.075 m
  # 2026-09-20: 트레이를 -0.36 으로 당겨 봤으나 어깨 막힘이 그대로여서 되돌렸다.
  # M0609 는 팔 베이스가 받침판에 바로 붙어 있어, 멀리 뒤로 뻗으면 **어깨(link_2)가 받침판에 닿아**
  # 접근 자세에 도달하지 못했다 (PhysX overlap 으로 확인). 트레이를 당겨 어깨 회전을 줄인다.
  # **z 를 2026-09-24 실측으로 갱신했다** (앞 값 0.1116~0.1119).
  # 트레이 원점이 z 0.37 → 0.3338 로 내려간 변화를 이 파일이 안 따라갔다 —
  # `TRAY_FROM` 이 같은 이유로 썩은 것과 같은 자리다.
  #   출처: plan_inputs 의 book_center_arm z (집는 책) 0.1275,
  #         survey 의 네 권 0.1249~0.1262 와 같은 자리
  #
  # **x·y 는 아직 안 고쳤다.** 실측과 x −10 mm · y −94 mm 어긋나 있지만, 그 값은
  # 책이 칸 안에서 어디 놓였느냐에 따라 달라진다. 칸 자체(지그 형상)를 트레이 USD
  # 에서 재서 넣어야 하고, 그 전까지는 지금 값을 둔다. 지금 안 드러나는 이유:
  # `snap_grasp_to_slot` 은 x 만 쓰고(가장 가까운 칸을 고르므로 10 mm 는 무해),
  # y 는 `validate_grasp` 의 허용치 ±0.15 가 94 mm 를 삼킨다.
  slots:
    - {index: 0, center: [-0.6623, 0.0788, 0.1275]}
    - {index: 1, center: [-0.5873, 0.0788, 0.1275]}
    - {index: 2, center: [-0.5123, 0.0788, 0.1275]}
    - {index: 3, center: [-0.4373, 0.0788, 0.1275]}
    - {index: 4, center: [-0.3623, 0.0788, 0.1275]}
    - {index: 5, center: [-0.2873, 0.0788, 0.1275]}
  # book_id → 칸 번호. 없는 book_id 는 아직 꺼내지 않은 첫 칸
  assignments: {}

# 참고: 검증된 꽂을 위치 (TargetSlot.position = 꽂힌 책 AABB 중심). 삽입 방향 arm_base_link +Y (yaw +90°)
#
# **로봇마다 다르다.** 좌표는 팔 기준인데 팔 베이스 높이가 로봇마다 달라서, 같은 선반 단이라도
# 팔 기준 z 가 달라진다. 높이만 다르고 서가·단은 같은 것을 쓴다.
#
# Franka (팔 베이스 월드 z 0.28, 선반판 윗면 0.498)      2026-09-17 검증
#   [-0.5097, 0.5495, 0.3400]  [-0.4297, 0.5495, 0.3400]
#   [-0.3497, 0.5495, 0.3399]  [-0.2697, 0.5495, 0.3398]
#
# M0609 결합체 (팔 베이스 월드 z 0.655, 선반판 윗면 1.042)  2026-09-20
#   [-0.4697, 0.5495, 0.5097]  [-0.3897, 0.5495, 0.5097]
#   [-0.3097, 0.5495, 0.5097]  [-0.2297, 0.5495, 0.5097]
#   - z 유도: 선반판 1.042 + 책높이/2 0.1187 + **삽입 여유 0.004** - 베이스 0.655 = 0.5097.
#     마지막 4 mm 는 book_scene.plan_job 의 grip_z = floor_z + Lb/2 + 0.004 에서 온다.
#     Franka 계약값 0.3399 도 같은 식으로 나온다 (0.497 + 0.1187 + 0.004 = 0.6197, 오차 0.2 mm).
#     처음에 이 4 mm 를 빠뜨려 0.5056 을 썼다 — 허용 오차 8 mm 의 절반을 그냥 까먹는 값이었다.
#     (웹 클로드 v20 회신이 두 로봇의 '선반판 위 띄움' 이 3.3 mm 다르다고 짚어서 찾았다)
#   - 단: 팔 베이스가 37 cm 높아 Franka 가 쓰던 단(0.498)은 팔 기준 -0.04 가 된다.
#     그 단은 받침판 윗면(0.655)보다 낮아 AMR 몸체가 서가에 먼저 닿는다 → 한 단 위(1.042)를 쓴다.
#   - x: 원래 4칸을 그대로 쓰면 가장 먼 -0.5097 에 IK 해가 없다 (닿는 대역 -0.48~-0.18).
#     간격 0.08 을 유지한 채 전체를 +0.04 옮겨 4/4 로 만들었다 (check_reach.py --scan-x).
#   - 로봇 배치: 서가 shelf_brown__book_shelf_05 앞, 팔 베이스 월드 [2.922, -0.895, 0.655], yaw 0
#     (place_robot_at_shelf.py. 받침판 모서리와 서가 앞면 사이 4.8 cm)
