# 모든 길이 단위는 m이다.
schema_version: 1

# TrayJob에 별도의 책 크기 정보가 없을 때 사용한다.
default_profile: standard

profiles:
  standard:
    description: "1차 시연용 기본 책"

    width: 0.18
    height: 0.24
    thickness: 0.035
    safety_margin: 0.01

  thin:
    description: "얇은 책"

    width: 0.17
    height: 0.23
    thickness: 0.02
    safety_margin: 0.01

  large:
    description: "크기가 큰 책"

    width: 0.22
    height: 0.30
    thickness: 0.05
    safety_margin: 0.015
