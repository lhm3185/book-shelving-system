# 비전팀 정답지 — 서가 빈칸 검출용
#
# **빈칸은 원래 없다.** 이 층 책들은 빈틈 없이 꽂혀 있다(이웃 간격이 전부 음수).
# 빈칸은 SIM_SHELF_GAP 으로 책을 빼서 만들고, 폭은 우리가 지정한다.
# 그러니 검출 대상은 '원래 있던 구멍' 이 아니라 **'우리가 낸 구멍'** 이고,
# 시험 단계마다 폭이 달라진다.
#
# 좌표는 전부 **world 기준**, 단위 m. 자동 생성: make_ground_truth.py
# 원자료: 20260923_gt_slots.txt (2026-09-23 실측)

shelf:
  prim: /World/bookshelves/shelf_brown__book_shelf_01
  floor: secondFloor
  board_z_world: 1.042
  note: >-
    낱권 책이 있는 서가는 이것 하나뿐이다. 나머지 15개는 책이
    book_cube 통짜 메시 하나라서 빈칸 검출 시험이 되지 않는다.
    이 층의 책에는 RigidBodyAPI 도 CollisionAPI 도 없다 — 순전히 장식이라
    검출 결과를 물리로 확인할 수 없다.
  book_count: 43
  x_span_world: [1.9108, 3.1778]
  thickness_m: {min: 0.0077, max: 0.0448, mean: 0.0319}
  neighbor_gap_m: {min: -0.0046, max: -0.0006}   # 전부 음수 = 겹쳐 있다

# 난이도 사다리. t = 우리가 꽂는 책 두께
inserted_book_thickness_m: 0.0353
ladder:
  - level: L1
    switch: "SIM_SHELF_GAP=23,55"
    removed_index: [23, 24]
    opened_width_m: 0.0543
    side_clearance_m: 0.0095    # 좌우 여유 — 검출 오차가 이보다 크면 실패가 난다
    gap_x_world: [2.5733, 2.6276]
    gap_center_x_world: 2.6005
  - level: L2
    switch: "SIM_SHELF_GAP=20,45"
    removed_index: [20, 21]
    opened_width_m: 0.0453
    side_clearance_m: 0.005    # 좌우 여유 — 검출 오차가 이보다 크면 실패가 난다
    gap_x_world: [2.5055, 2.5508]
    gap_center_x_world: 2.5282
  - level: L3
    switch: "SIM_SHELF_GAP=20,40"
    removed_index: [20]
    opened_width_m: 0.039
    side_clearance_m: 0.0019    # 좌우 여유 — 검출 오차가 이보다 크면 실패가 난다
    gap_x_world: [2.5055, 2.5445]
    gap_center_x_world: 2.525

