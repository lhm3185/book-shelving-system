# 로봇팔 동작 파라미터 — **nova-carter + M0609(+RG2)** 용.
# 기존 arm.yaml(Franka, 검증 완료)은 건드리지 않는다. ARM_ROBOT=m0609 일 때 이 파일을 쓴다.
#
# 로봇: M0609 6축 + OnRobot RG2
# 좌표계: 쿼터니언은 (w, x, y, z), 길이는 m, 각도는 rad

frame: base_link            # Franka 의 panda_link0 에 해당

# --------------------------------------------------------------- 자세
# 관절 순서: joint_1 ~ joint_6 (**6개** — Franka 는 7개였다)
#
# **2026-09-20 실측** (`measure_poses.py`, 레벨 level_plate_fix.usd).
# 자기검증 3종 통과 상태에서 쟀다 (왕복 자기일치·오답 주입·로봇이 원점에서 5.91 m).
poses:
  # 트레이 중앙(팔 기준 -0.475, 0.079, 0.112) 위 0.30 m 를 내려다보는 IK 해.
  # 매번 집으러 갈 때 크게 돌지 않고 손목 카메라가 트레이를 본다.
  home:  [-0.1513, -1.4798, 1.2828, -0.0001, -2.9449, 2.9901]
  # 주행 자세. **받침판 발자국 안**에 들어가는 자세 중 가장 낮은 것 (판 위 0.50 m).
  # 주행 중 서가에 닿지 않게 하는 것이 목적이다.
  stow:  [0.0, -1.6, 2.2, 0.0, 1.0, 0.0]

# --------------------------------------------------------------- 속도
speed:
  joint_rad_s:    1.0
  joint_rad_s2:   2.0
  linear_m_s:     0.15
  approach_scale: 0.4
  lift_scale:     0.5
  insert_scale:   0.25
  retreat_scale:  0.5

# --------------------------------------------------------------- 그리퍼
# RG2 는 폭이 아니라 **각도**로 움직인다. 코드에서 폭(m)으로 다루고
# robot_profiles.RobotProfile.grip_targets 가 각도로 바꾼다 (양쪽 knuckle 대칭, 부호 반대).
# `finger_joint` 은 명령해도 0.0008 rad 밖에 안 움직여 명령 대상이 아니다 (2026-09-19 실측).
gripper:
  open_m:      0.04         # 프로파일 GRIP_MAX_M 과 같게 둔다
  grasp_m:     0.012
  settle_s:    0.3
  tolerance_m: 0.006        # 폐루프 링크라 Franka 보다 느슨하게

# --------------------------------------------------------------- 파지
# 아래 값들은 Franka 기준으로 맞춰 둔 것이라 M0609 로 다시 봐야 한다.
grasp:
  approach_m: 0.10
