# --------------------------------------------------------------- 속도
speed:
  joint_rad_s:    1.0
  joint_rad_s2:   2.0
  linear_m_s:     0.15
  approach_scale: 0.4
  lift_scale:     0.5
  insert_scale:   0.25
  retreat_scale:  0.5

# --------------------------------------------------------------- 그리퍼
# RG2 는 폭이 아니라 **각도**로 움직인다. 코드에서 폭(m)으로 다루고
# robot_profiles.RobotProfile.grip_targets 가 각도로 바꾼다 (양쪽 knuckle 대칭, 부호 반대).
# `finger_joint` 은 명령해도 0.0008 rad 밖에 안 움직여 명령 대상이 아니다 (2026-09-19 실측).
gripper:
  open_m:      0.04         # 프로파일 GRIP_MAX_M 과 같게 둔다
  grasp_m:     0.012
  settle_s:    0.3
  tolerance_m: 0.006        # 폐루프 링크라 Franka 보다 느슨하게
  # RG2 는 명령한 관절각이 그대로 안 읽힌다 → 폭 도달을 기다리지 않고 정착 시간만 본다
  check_width: false

# --------------------------------------------------------------- 파지
# 아래 값들은 Franka 기준으로 맞춰 둔 것이라 M0609 로 다시 봐야 한다.
grasp:
  approach_m: 0.05          # M0609 는 0.10 이면 접근점이 팔 기준 z 0.32 로 올라가 IK 가 안 풀린다 (2026-09-20)
  # 6축은 높이 여유가 적다. 0.13/0.17 이면 접근 IK 가 안 풀린다 (2026-09-20 실측)
  pre_lift_m:   0.10          # 0.03 이면 앞팔(link_4)이 트레이를 28cm 파고든다 (2026-09-20 겹침검사). 게이트에서 0.10 은 6칸 모두 IK 통과
  carry_lift_m: 0.12
  lift_check_m: 0.05        # 관절 허용 오차 0.08 rad 가 손끝에서 약 3 cm 라 여유를 둔다

# --------------------------------------------------------------- 삽입
# arm.yaml(Franka, 검증 완료)과 같은 값으로 시작한다. M0609 로 게이트 2 를 돌려 보고 조정한다.
insert:
  depth_m:        0.12
  standoff_m:     0.15
  axis:           [1.0, 0.0, 0.0]
  release_wait_s: 0.3

# --------------------------------------------------------------- TCP
tcp:
  offset_m: [0.0, 0.0, 0.0]

# --------------------------------------------------------------- 제한 시간
# 6축은 같은 목표에 가려면 관절이 더 크게 돈다. 그리고 URDF 임포트 드라이브가 Franka 보다
# 느슨해 정착이 오래 걸린다 — 8초로는 시작 홈 이동부터 M404 가 난다 (2026-09-20 실측).
timeout:
  default_s:      20.0
  move_joint_s:   20.0
  move_linear_s:  20.0

# --------------------------------------------------------------- 허용 오차
# 6축이라 Franka(7축)보다 여유 자세가 적다. 우선 같은 값으로 두고 게이트 2 결과를 보고 푼다.
# 드라이브 정착 오차가 Franka 보다 크다. 너무 조이면 도달했는데도 계속 기다리다 시간 초과가 난다.
tolerance:
  joint_rad:  0.08
  position_m: 0.008
