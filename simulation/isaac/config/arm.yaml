# 로봇팔 동작 파라미터. 코드에는 숫자를 박지 않는다.
# 튜닝은 전부 이 파일에서 하고, 코드 변경 없이 시연 파라미터를 확정한다.
#
# 로봇: ridgeback_franka (Franka Panda 7축 + Franka Hand 평행 조)
# 좌표계: 쿼터니언은 (w, x, y, z), 길이는 m, 각도는 rad

frame: panda_link0          # 모든 Pose 의 기준 프레임 (팀 합의 필요)

# --------------------------------------------------------------- 자세
# 관절 순서: panda_joint1 ~ panda_joint7 (그리퍼 관절은 제외)
poses:
  # 데크(트레이)를 내려다보는 자세 — 책 위 30cm (2026-09-17, v3 레벨 IK 결과)
  # 매번 집으러 갈 때 크게 돌 필요가 없고 손목 카메라가 트레이를 본다
  home:  [2.811, -0.514, 0.102, -2.213, 0.051, 1.701, -1.033]
  # (이전) Isaac Sim Franka 기본 자세: [0.0, -1.16, 0.0, -2.3, 0.0, 1.6, 0.79]
  # 주행 안전 자세. 팔을 접어 AMR 실루엣 안에 넣는다.
  # Nav2 목표를 주기 전에 반드시 이 자세를 거친다
  stow:  [0.0, -1.75, 0.0, -2.8, 0.0, 1.1, 0.79]

# --------------------------------------------------------------- 속도
speed:
  joint_rad_s:    1.0       # 관절 이동 최대 속도
  joint_rad_s2:   2.0       # 관절 이동 가감속. 없으면 위치 제어가 뒤처졌다 따라잡으며 각속도가 튄다
  linear_m_s:     0.15      # 직교 직선 이동 기본 속도
  approach_scale: 0.4       # 책에 다가갈 때 (기본 속도 대비)
  lift_scale:     0.5       # 들어올릴 때
  insert_scale:   0.25      # 슬롯 삽입 — "저속 삽입" 요구사항
  retreat_scale:  0.5       # 빼낼 때

# --------------------------------------------------------------- 그리퍼
# Franka Hand: 손가락당 0.0 ~ 0.05 (Isaac Sim 5.1.0 설치본에서 확인)
gripper:
  open_m:      0.05         # 완전 개방
  grasp_m:     0.012        # 1차 고정값. 책 두께 2~4cm 를 눌러 잡는 폭
  settle_s:    0.3          # 폭 도달 후 안정화 대기
  tolerance_m: 0.006

# --------------------------------------------------------------- 파지
grasp:
  approach_m: 0.10
  # 아래 둘은 그동안 **코드에 박혀 있던** 값이다 (검증된 Franka 동작 유지).
  # 기존 lift_m 과 이름이 겹치지 않게 따로 둔다 — lift_m 은 코드가 쓰지 않는다.
  pre_lift_m:   0.13        # 파지 전 대기 높이 (책 위)
  carry_lift_m: 0.17        # 잡고 들어올리는 높이
  lift_check_m: 0.08        # 파지 확인: 책이 이만큼 올라와야 한다 (그동안 코드에 박혀 있던 값)
  lift_m:     0.12          # (미사용) 잡고 얼마나 올릴지

# --------------------------------------------------------------- 삽입
insert:
  depth_m:         0.12     # 슬롯 안으로 밀어 넣는 깊이 (1차 고정값)
  standoff_m:      0.15     # 사전 삽입 위치까지의 거리
  axis:            [1.0, 0.0, 0.0]   # 삽입 방향 (서가 좌표계 기준, 팀 합의 필요)
  release_wait_s:  0.3      # 놓고 나서 빼기 전 대기

# --------------------------------------------------------------- TCP
tcp:
  # 그리퍼 기준점과 "책 중심" 사이의 보정. 실측 후 채운다
  offset_m: [0.0, 0.0, 0.0]

# --------------------------------------------------------------- 허용 오차
# 아래 값은 그동안 book_scene.py 가 **코드에서 덮어쓰던 것**이다. yaml 이 무시되고 있었고,
# 로봇을 바꿀 때 왜 조정이 안 먹는지 찾는 데 시간을 썼다 → 설정으로 끌어냈다 (2026-09-20).
# 검증된 Franka 동작을 유지하려고 그 값을 그대로 적는다 (원래 주석값은 0.01 / 0.002).
tolerance:
  joint_rad:  0.03
  position_m: 0.008         # 요구사항은 삽입 최종 오차 30mm 이하. 여유 있게 잡았다

# --------------------------------------------------------------- 제한 시간
# 벽시계가 아니라 스텝 수로 환산해 센다. 렌더가 느린 PC 에서 오판정되지 않게 한다
timeout:
  default_s:     10.0
  move_joint_s:   8.0
  move_linear_s: 10.0
